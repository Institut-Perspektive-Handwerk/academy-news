name: News sammeln
on:
  schedule:
    - cron: "17 */2 * * *"   # alle 2 Stunden
  workflow_dispatch:
permissions:
  contents: write
jobs:
  sammeln:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python news_sammeln.py
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      - name: news.json und Einordnung committen, wenn sich etwas geändert hat
        run: |
          git config user.name "iph-news-bot"
          git config user.email "actions@users.noreply.github.com"
          git add news.json einordnung.json
          git diff --cached --quiet || (git commit -m "News aktualisiert" && git push)
